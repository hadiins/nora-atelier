version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: nora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nora_user
      POSTGRES_PASSWORD: nora_pass
      POSTGRES_DB: nora_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nora_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
